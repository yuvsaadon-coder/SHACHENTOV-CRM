# CI for the coordinator voting app (voting/). Runs only when voting/ changes; the CRM is not affected.
name: voting-ci
on:
  push:
    paths: ['voting/**', '.github/workflows/voting-ci.yml']
  pull_request:
    paths: ['voting/**', '.github/workflows/voting-ci.yml']
permissions:
  contents: read
defaults:
  run:
    working-directory: voting
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voting/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:reference
      - run: npm test
      - run: npm run test:rules
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
