[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The chatbot functions do Firestore reads + a full (non-streaming) Anthropic
# completion in one request — push the timeout as high as the plan allows
# instead of the ~10s default, which was killing them mid-response
# ("Gateway Timeout"). No effect on plans that don't support the override.
[functions."hq-chat"]
  timeout = 26

[functions."chat"]
  timeout = 26

# Functions must be matched before the SPA catch-all below, otherwise
# /.netlify/functions/* is rewritten to index.html and every call returns HTML.
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # CSP: allow self + Firebase (googleapis.com) + Google Fonts.
    # 'unsafe-inline' on script-src is required for Vite's injected module-preload scripts.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com; img-src 'self' data: blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
