[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The chatbot functions do Firestore reads + a full (non-streaming) Anthropic
# completion in one request — push the timeout as high as the plan allows
# instead of the ~10s default, which was killing them mid-response
# ("Gateway Timeout"). No effect on plans that don't support the override.
[functions."hq-chat"]
  timeout = 26

[functions."chat"]
  timeout = 26

# Functions must be matched before the SPA catch-all below, otherwise
# /.netlify/functions/* is rewritten to index.html and every call returns HTML.
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
