# Netlify site for the voting app. In the Netlify UI set "Base directory" = voting
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The quote analysis calls Claude; ask for the longest synchronous time the plan allows.
[functions."analyze-quote"]
  timeout = 26
